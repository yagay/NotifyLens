name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notifylens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install project SDK
        run: |
          set -o pipefail
          sdkmanager "cmdline-tools;23.0" 2>&1 | tee sdk-tools.log
          sdk_manager="${ANDROID_HOME}/cmdline-tools/23.0/bin/sdkmanager"
          "$sdk_manager" --list --channel=3 > sdk-packages.log 2>&1
          "$sdk_manager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0" "platform-tools" 2>&1 | tee sdk-install.log
          test -s "${ANDROID_HOME}/platforms/android-37.0/android.jar"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Unit tests
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest 2>&1 | tee unit-test.log

      - name: Build debug
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain --stacktrace :app:assembleDebug 2>&1 | tee debug-build.log

      - name: Build release
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain --stacktrace :app:assembleRelease 2>&1 | tee release-build.log

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: NotifyLens-apks-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NotifyLens-build-log-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            sdk-tools.log
            sdk-packages.log
            sdk-install.log
            unit-test.log
            debug-build.log
            release-build.log
          if-no-files-found: ignore
          retention-days: 7
